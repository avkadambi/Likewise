# Likewise materiality specification.
# See docs/TECHNICAL_DESIGN.md. This file is the comparability standard: signed, versioned, immutable
# once published, cited by digest on every finding. It is NOT fitted and NOT tuned.
version: "1.1.0"
effective_date: "2026-09-07"
author: "unsigned"
bin_snapshot: "ffiec_flg_2024_2026-09-07"
budget: "1.0.0"

# v1.1.0 rationale (a version without a written rationale should be impossible to
# publish). No matching rule changed. The specification is re-pointed at the 2024
# publication snapshot because the retrieved file is a 2024 filing, and every granularity
# claim in that snapshot is now checked against the file itself rather than asserted from
# a document nobody has read. The comparability standard is unchanged, so findings under
# 1.0.0 and 1.1.0 are not comparable only because the underlying filing year differs.
supersedes: "1.0.0"

# --- population  -------------------------------------------------
population:
  approved_actions: [1, 2]        # 2 = approved but not accepted; still a lender approval
  denied_actions: [3]
  excluded_actions: [4, 5, 6, 7, 8]
  context_actions: [4, 5]         # withdrawn / file closed -- reported, not scored
  exclude_flags:
    open_end_line_of_credit: 1
    reverse_mortgage: 1
    business_or_commercial_purpose: 1
  max_total_units: 4

# --- blocking  --------------------------------------------
blocking:
  key:
    - lei
    - activity_year
    - loan_purpose
    - occupancy_type
    - lien_status
    - loan_type
    - county_code
    - aus_1
    - construction_method
    - total_units
    - submission_of_application
    - initially_payable_to_institution
    - conforming_loan_limit
    - amortization
    - interest_only_payment
    - balloon_payment
    - negative_amortization
    - has_co_applicant
  band:
    loan_amount: {relative: 0.10, min_absolute: 20000}
    income:      {relative: 0.10, min_absolute: 2000}
  max_block_rows: 5000
  subblock_on: loan_amount

# Everything in the blocking key must also be an exact-match field.
exact_match_required:
  - activity_year
  - loan_purpose
  - occupancy_type
  - lien_status
  - loan_type
  - county_code
  - aus_1
  - construction_method
  - total_units
  - submission_of_application
  - initially_payable_to_institution
  - conforming_loan_limit
  - amortization
  - interest_only_payment
  - balloon_payment
  - negative_amortization
  - has_co_applicant

# --- control set C : matched within tolerance --------------------
control_features:
  income:
    tolerance: 0.05
    unit: relative
    reference: min
    min_absolute: 2000
    rationale: "Above publication rounding ($1,000) at typical values; min_absolute keeps the
                comparison meaningful below $40k where the relative window would fall under a
                single rounding unit."
  loan_amount:
    tolerance: 0.05
    unit: relative
    reference: min
    min_absolute: 20000
    rationale: "Two publication bins ($10,000 each). Below $400k the floor binds, which is
                deliberate: a relative window narrower than the bin width is not a measurement."

# --- residual risk set R  -------------------------------
# Published risk dimensions in neither T nor C. Clause 4: the approved comparator must not be
# strictly better than the denied file beyond tolerance on any of these. Catches a collateral
# finding where the approved file has worse LTV but far better DTI.
residual_risk:
  debt_to_income_ratio:
    tolerance: 3.0
    unit: percentage_points
    direction: higher_is_worse
    # DTI is published as integers only in 36-49 and in >=10pp buckets outside it. A single
    # global tolerance would enforce a materiality standard that varies by an order of
    # magnitude across the population. Restrict the dimension to the region where the
    # published resolution can carry it; elsewhere it is below_resolution for that pair.
    applies_when: {field: debt_to_income_ratio, integer_range: true}
    rationale: "One DTI bucket plus margin, applied only in the 36-49 integer region where
                DTI is published at 1pp. Prevents a code-4 finding where the comparator is
                materially stronger on capacity."

# --- suspected resubmission  -------------------------------------
# No action date exists in the Modified LAR, so this is a signature, not a time window.
# Matching pairs are ROUTED to their own denominator, not silently dropped.
suspected_resubmission:
  signature:
    - lei
    - county_code
    - loan_purpose
    - occupancy_type
    - lien_status
    - property_value_bin
    - income_bin
  property_value_bin_width: 10000
  income_bin_width: 10000

# --- disclosure  ---------------------------------------
disclosure:
  k_min: 5
  geography_ceiling: county
  # The k-anonymity cohort is defined over the attributes an adversary would use to
  # RE-IDENTIFY a borrower against the public file -- coarse geography plus banded
  # financials -- not over the full internal blocking key. Including underwriting
  # fields such as aus_1, amortization or balloon_payment shrinks the cohort without
  # adding any disclosure protection: they are not what identifies a person.
  # Measured on the dev slice: cohort on the full 18-field key + bands gives a median
  # of 1 and zero cohorts at k>=5; cohort on the key below gives a workable
  # distribution. See tools/diagnose_cohort.py.
  cohort_key: [lei, activity_year, county_code, loan_purpose, occupancy_type, lien_status]
  bands:
    income: 10000
    property_value: 25000
    combined_loan_to_value_ratio: 5
    loan_amount: 25000

# --- statistics  -------------------------------------------
statistics:
  cell_power_min: 10        # below this a cell cannot reach q; see the method document, cells and power
  fdr_q: 0.10
  permutation_B: 2000
  permutation_B_initial: 200
  permutation_B_max: 5000

# --- tripwires  --------------------------------------------
# Two-sided. A rate BELOW the lower bound triggers the same investigation as one above.
tripwires:
  not_supported_rate: {low: 0.01, high: 0.40}
  matched_fraction:   {low: 0.02, high: 0.60}
  median_margin_ratio: {low: 2.0}
  cited_over_placebo:  {low: 2.0}
